<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Productos</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="div-admin">
<h2>Modificar producto</h2>
	<form class="form-modificar">
	<div class="campo">
	<label>Nombre del producto:</label>
	<input type="text" id="nombreProducto" placeholder="Nombre del producto a buscar">
	</div>
	<div class="campo">
	<label>Nuevo nombre:</label>
	<input type="text" id="nuevoNombre" placeholder="Nombre del producto a modificar">
	</div>
	<div class="campo">
	<label>Nueva descripción :</label>
	<input type="text" id="nuevaDescripcion" placeholder="Nueva descripción">
	</div>
	<div class="campo">
	<label>Nuevo precio:</label>
	<input type="number" id="nuevoPrecio" placeholder="Nuevo precio">
	</div>
	<div class="campo">
    <label>Tipo de IVA:</label>
    <select id="nuevoIVA">
    <option value="minimo">IVA mínimo</option>
    <option value="basico">IVA básico</option>
    <option value="ninguno">sin IVA</option>
   </select>
	</div>
	<div class="campo">
	<label>Nuevo stock:</label>
	<input type="number" id="nuevoStock" placeholder="Nuevo stock">
	</div>
	<div class="campo">
	<label>Nueva imagen:</label>
	<input type="text" id="nuevaImagen" placeholder="Nueva ruta de imagen">
	</div>
	<button type="button" class="btn-carrito" id="btn-modificar-producto">Modificar producto</button>
</form>
</div>
	<button type="button" class="btn-irProductos" id="btn-productos">Ir Productos</button>
   <script type="module" src="./scripts/main.js"></script>
</body>
</html>
